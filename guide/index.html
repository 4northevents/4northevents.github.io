b{display:block;font-size:28px;margin-bottom:8px}a{color:#9fdcff}
</style>
<script>
// Tournament guides, in date order. Add a line here for each new guide.
// The /guide link opens the first tournament whose last day hasn't passed yet.
var EVENTS = [
  { page: "../winter-classic/", lastDay: "2027-02-14" }
];
(function(){
  var now = new Date(), today = now.getFullYear()*10000 + (now.getMonth()+1)*100 + now.getDate();
  for (var i = 0; i < EVENTS.length; i++) {
    if (Number(EVENTS[i].lastDay.replace(/-/g, "")) >= today) { location.replace(EVENTS[i].page); return; }
  }
  window.__none = true;
})();
</script>
</head>
<body>
<div id="msg"><b>4N Events</b>Loading the tournament guide…</div>
<script>
if (window.__none) document.getElementById('msg').innerHTML = '<b>4N Events</b>The next tournament guide is coming soon.<br>Questions? Call <a href="tel:4322028939">432-202-8939</a> or visit the <a href="../helpdesk/">Help Desk</a>.';
</script>
